apis:
- aid: resulticks-web-api
  name: Resul Web API
  description: >-
    The Resul (Resulticks) Web API is a JSON REST API served from the
    https://apis.resu.io base domain, documented publicly at gud.resulticks.com.
    Its call surface is grouped into six documented categories: API Keys
    (accounts and permissions on Resul objects), Account Setup (account
    specification for communication execution), Data Ingestion (audience lists,
    suppression rules, recipient records), Communication (communication types,
    setup, design and scheduling), Communication response analytics
    (consolidated metrics for reporting), and Statistical sharing (pushing
    communication metrics to client data sources). No OpenAPI definition is
    published; the API host does not accept connections from the public
    internet.
  humanURL: https://gud.resulticks.com/API-reference/introduction/
  baseURL: https://apis.resu.io
