aid: resulticks
name: Resulticks
description: >-
  Resulticks is an enterprise omnichannel marketing automation and audience
  engagement platform, operating under the RESUL brand. It pairs a
  cookie-independent customer data platform with real-time campaign
  orchestration across email, SMS, WhatsApp, RCS, LINE, web and mobile push,
  in-app messaging, voice, social and paid channels, plus audience scoring,
  Audience 360 journey analytics, a form generator and AI-assisted audience
  building. Resulticks publishes a public documentation portal at
  gud.resulticks.com carrying a REST API reference — account setup, data
  ingestion, audience and target-list management, communication creation and
  scheduling, and response analytics — against the base domain
  https://apis.resu.io, alongside web, Flutter, React Native, Cordova and iOS
  SDK guides. It ships no machine-readable API definition (no OpenAPI,
  AsyncAPI, GraphQL schema or MCP server), no public pricing, and no status or
  changelog page; the API host itself is not reachable from the public internet
  and is customer-scoped. Resulticks is backed by 500 Global.
